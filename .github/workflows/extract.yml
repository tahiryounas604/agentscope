name: Extract uploaded product
on:
  push:
    paths:
      - ".github/workflows/extract.yml"
  workflow_dispatch:
permissions:
  contents: write
  workflows: write
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Extract agentscope.zip to repo root
        run: |
          set -e
          test -f agentscope.zip
          mkdir -p /tmp/extracted
          unzip -o agentscope.zip -d /tmp/extracted
          shopt -s dotglob
          cp -a /tmp/extracted/agentscope/. .
          rm -f agentscope.zip
          rm -f .github/workflows/extract.yml
      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git status --short
          git commit -m "Upload AgentScope product files"
          git push
